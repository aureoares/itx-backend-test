server:
  port: 5000

spring:
  application:
    name: similar-products
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

upstream:
  catalog:
    base-url: ${UPSTREAM_CATALOG_BASE_URL:http://localhost:3001}
    connect-timeout-ms: 1000
    read-timeout-ms: 5000
    max-connections-per-route: 200
    max-total-connections: 500
